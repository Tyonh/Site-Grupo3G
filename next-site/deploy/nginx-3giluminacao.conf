# /etc/nginx/sites-available/3giluminacao.com.br
#
# Domínio dedicado só a este site (3giluminacao.com.br), separado dos
# outros projetos da VPS que respondem em grupo3giluminacao.com.br.
#
# Bloco inicial (antes do certbot) — proxy reverso pra o Next.js rodando
# via PM2 na porta 3010. Depois de ativar esse site e rodar o certbot,
# ele mesmo edita este arquivo automaticamente, adicionando o bloco
# server { listen 443 ssl; ... } e o redirect de HTTP pra HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name 3giluminacao.com.br www.3giluminacao.com.br;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Assets estáticos do Next.js (_next/static) já vêm com cache-control
    # forte do próprio Next; não precisa de location extra pra isso.

    client_max_body_size 20M;
}
